[package]
name = "kargo-plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
kargo-plugin-api = { path = "../../../kargo-plugin/kargo-plugin-api", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.47", features = ["full"] }
gix = { version = "0.73", features = ["blocking-network-client"] }
git-url-parse = "0.6"
toml_edit = "0.23"
serde = { version = "1.0", features = ["derive"] }
dirs = "6.0"
log = "0.4"
env_logger = "0.11"
tempfile = "3.23"
jwalk = "0.8"
